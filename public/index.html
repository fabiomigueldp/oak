<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#18211c">
  <title>Oak · Mapa e conversa</title>
  <link rel="stylesheet" href="/style.css?v=4">
  <script src="/app.js?v=3" defer></script>
</head>
<body>
  <a class="skip" href="#main">Ir para o mapa</a>
  <header class="site-header">
    <h1><a class="brand" href="/" aria-label="Oak, início"><svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 3C6 3 3 13 8 20c2 3 6 3 8 2 2 1 6 1 8-2 5-7 2-17-8-17Z" fill="currentColor"/><path d="M16 13v16m0-10-5-4m5 7 5-5" stroke="var(--bg)" stroke-width="2" fill="none"/></svg>oak</a></h1>
    <div class="header-actions">
      <span id="state" role="status">Conectando…</span>
      <button id="copy" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>Copiar endereço</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div id="notice" role="status" hidden></div>
    <div class="workspace">
      <section class="map-panel" aria-labelledby="map-title">
        <div class="map-toolbar">
          <h2 id="map-title">Mapa</h2>
          <div class="map-actions">
            <a class="chat-jump" href="#conversation">Conversa</a>
            <details class="map-help">
              <summary aria-label="Sobre o mapa" title="Sobre o mapa"><span aria-hidden="true">?</span></summary>
              <p>O terreno aparece após o salvamento e a renderização. Ajuste o nível de detalhe no menu do mapa.</p>
            </details>
            <a class="expand-map" href="/map/">Expandir<span aria-hidden="true">↗</span><span class="sr-only"> mapa</span></a>
          </div>
        </div>
        <iframe src="/map/" title="Mapa interativo de Oak" allow="fullscreen"></iframe>
      </section>
      <aside aria-label="Comunidade">
        <section class="presence" aria-labelledby="players-title">
          <div class="section-heading"><h2 id="players-title">Jogadores online</h2><span id="count">—</span></div>
          <ul id="players"><li class="muted">Carregando…</li></ul>
        </section>
        <section class="conversation" id="conversation" aria-labelledby="chat-title" tabindex="-1">
          <div class="section-heading"><h2 id="chat-title">Conversa</h2><span id="live" role="status">Conectando…</span></div>
          <div id="chat" role="log" aria-label="Conversa do servidor" aria-live="polite" tabindex="0"><p class="empty">Carregando…</p></div>
          <form id="chat-form">
            <label for="name">Seu nome</label>
            <input id="name" name="name" placeholder="Como você aparece no jogo" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" title="Use de 3 a 16 letras, números ou sublinhados." autocomplete="nickname" spellcheck="false" required>
            <div class="compose">
              <label class="sr-only" for="message">Mensagem para o jogo</label>
              <textarea id="message" name="message" placeholder="Mensagem para o jogo…" rows="2" maxlength="240" required></textarea>
              <button id="send" type="submit" aria-label="Enviar mensagem"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
            </div>
            <div class="form-bottom"><span>No jogo, você aparece como <b>[Web]</b></span><span id="form-status" role="status"></span></div>
          </form>
        </section>
      </aside>
    </div>
  </main>
  <div id="toast" role="status"></div>
</body>
</html>
