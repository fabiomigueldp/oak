server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2k;
 location = /map/index.html {
  # Inject before BlueMap's module; never modify the generated webapp on disk.
  sub_filter '<head>' '<head><script src="/map-profile.js?v=1"></script><link rel="stylesheet" href="/map-profile.css?v=1">';
  sub_filter_once on;
  etag off;
  if_modified_since off;
  add_header Cache-Control no-cache;
 }
 location /api/ {
  proxy_pass http://172.19.0.1:8091;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header Origin $http_origin;
  proxy_buffering off;
  proxy_read_timeout 60s;
 }
 location = /status.json { add_header Cache-Control no-store; }
}
