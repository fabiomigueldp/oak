server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2k;
 location /api/ {
  proxy_pass http://172.19.0.1:8091;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header Origin $http_origin;
  proxy_buffering off;
  proxy_read_timeout 60s;
 }
 location = /status.json { add_header Cache-Control no-store; }
}
