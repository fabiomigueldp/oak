server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2k;
 location = /map/index.html {
  # Inject before BlueMap's module; never modify the generated webapp on disk.
  sub_filter '<head>' '<head><script src="/map-profile.js?v=2"></script><link rel="stylesheet" href="/map-profile.css?v=3"><script defer src="/map-admin-bridge.js?v=2"></script><link rel="stylesheet" href="/map-admin-bridge.css?v=1">';
  sub_filter_once on;
  etag off;
  if_modified_since off;
  add_header Cache-Control no-cache;
 }
 location /api/ {
  proxy_pass http://172.19.0.1:8091;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header Origin $http_origin;
  proxy_buffering off;
  proxy_read_timeout 60s;
 }
 location = /status.json { add_header Cache-Control no-store; }
 location = /admin { return 302 /admin/; }
 location /admin/api/ {
  client_max_body_size 64k;
  proxy_pass http://172.19.0.1:8091;
  proxy_set_header Origin $http_origin;
  proxy_buffering off;
  proxy_read_timeout 180s;
  proxy_send_timeout 30s;
 }
 location /admin/assets/ {
  alias /usr/share/nginx/html/admin/;
  add_header Cache-Control no-cache;
  add_header X-Content-Type-Options nosniff;
 }
 location /admin/ {
  try_files $uri /admin/index.html;
  add_header Cache-Control no-store;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header X-Frame-Options DENY;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'";
 }
}
