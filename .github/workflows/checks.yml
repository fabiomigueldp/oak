name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: python scripts/check.py
      - run: node --check public/app.js
      - run: node --check public/map-profile.js
      - run: node --test tests/test_map_profile.js
      - run: python -m pip install -r requirements-admin.txt
      - run: python tests/test_admin.py
      - run: python tests/test_telemetry.py
      - run: python tests/test_environment.py
      - run: python tests/test_aviary.py
      - run: node --check public/admin/aviary.js
      - run: node --check public/admin/environment.js
      - run: node --check public/admin/app.js
      - run: node --check public/admin/backups.js
      - run: node --check public/admin/model.js
      - run: node --check public/admin/demo-map.js
      - run: node --check public/map-admin-bridge.js
      - run: node --check public/map-player-avatar.js
      - run: npm install --prefix "$RUNNER_TEMP/oak-avatar-check" --no-audit --no-fund three@0.147.0
      - run: node --test tests/test_avatar.js
        env:
          OAK_TEST_THREE: ${{ runner.temp }}/oak-avatar-check/node_modules/three/build/three.cjs
      - run: node --test tests/test_admin_model.mjs tests/test_admin_bridge.js
